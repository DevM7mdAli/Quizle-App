name: quizle
description: A bilingual quiz application for Arabic and English learners.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^15.1.3
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/content/
    - images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/quizle-icon-source.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#3328A8"
  web:
    generate: true
    image_path: assets/branding/quizle-icon-source.png
    background_color: "#3328A8"
    theme_color: "#5146D8"
  macos:
    generate: true
    image_path: assets/branding/quizle-icon-source.png
