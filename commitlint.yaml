rules:
  type-case:
    - 2
    - always
    - lower-case
  type-empty:
    - 2
    - never
  type-enum:
    - 2
    - always
    - - build
      - chore
      - ci
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - style
      - test
  scope-case:
    - 2
    - always
    - kebab-case
  subject-empty:
    - 2
    - never
  subject-full-stop:
    - 2
    - never
    - "."
  header-max-length:
    - 2
    - always
    - 100
  body-max-line-length:
    - 2
    - always
    - 100
  footer-max-line-length:
    - 2
    - always
    - 100

defaultIgnores: true
ignores:
  - '^feat: add localization for quiz features in Arabic and English(\r?\n|$)'
